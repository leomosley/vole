name: Release

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0
          components: rustfmt, clippy

      # Public release on main is gated on the crate version: it publishes
      # v<version> only when that release does not already exist. Bump the
      # version in apps/desktop/Cargo.toml and merge to cut a release. Pushes to
      # dev always produce a fresh contributor draft.
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -eq "refs/heads/main") {
            $manifest = Get-Content apps/desktop/Cargo.toml -Raw
            $version = [regex]::Match($manifest, '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
            $tag = "v$version"
          } else {
            $version = "0.1.0-dev.${{ github.run_number }}"
            $tag = "dev-${{ github.run_number }}"
          }
          "value=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Check for existing release
        id: existing
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view "${{ steps.version.outputs.tag }}" 2>$null
          if ($LASTEXITCODE -eq 0) {
            "exists=true" >> $env:GITHUB_OUTPUT
            Write-Host "Release ${{ steps.version.outputs.tag }} already exists; skipping."
          } else {
            "exists=false" >> $env:GITHUB_OUTPUT
          }

      - name: Check
        if: steps.existing.outputs.exists != 'true'
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked

      - name: Build
        if: steps.existing.outputs.exists != 'true'
        run: cargo build --release --locked --package vole

      - name: Build installer
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          iscc "/DAppVersion=${{ steps.version.outputs.value }}" installer/vole.iss

      - name: Publish public release
        if: github.ref == 'refs/heads/main' && steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: >
          gh release create "${{ steps.version.outputs.tag }}" dist/*.exe
          --target "${{ github.sha }}"
          --title "VOLE ${{ steps.version.outputs.value }}"
          --generate-notes

      - name: Publish contributor draft
        if: github.ref == 'refs/heads/dev'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $previous = gh release list --json isDraft,tagName --jq '.[] | select(.isDraft) | .tagName' | Select-Object -First 1
          if ($previous) { gh release delete $previous --cleanup-tag --yes }
          $tag = "dev-${{ github.run_number }}"
          gh release create $tag dist/*.exe --target "${{ github.sha }}" --draft --title "VOLE dev build ${{ github.run_number }}" --notes "Contributor test build from dev at ${{ github.sha }}."
