name: Release

on:
  push:
    branches: [dev]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0
          components: rustfmt, clippy

      - name: Check
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked

      - name: Build
        run: cargo build --release --locked --package vole

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart("v")
          } else {
            $version = "0.1.0-dev.${{ github.run_number }}"
          }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          iscc "/DAppVersion=${{ steps.version.outputs.value }}" installer/vole.iss

      - name: Publish tagged release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create "${{ github.ref_name }}" dist/*.exe --generate-notes --verify-tag

      - name: Publish contributor draft
        if: github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $previous = gh release list --json isDraft,tagName --jq '.[] | select(.isDraft) | .tagName' | Select-Object -First 1
          if ($previous) { gh release delete $previous --cleanup-tag --yes }
          $tag = "dev-${{ github.run_number }}"
          gh release create $tag dist/*.exe --target "${{ github.sha }}" --draft --title "VOLE dev build ${{ github.run_number }}" --notes "Contributor test build from dev at ${{ github.sha }}."
